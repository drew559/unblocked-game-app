<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Highway Rush</title>
    <style>
      :root {
        --bg: #070b14;
        --panel: rgba(15, 22, 34, 0.9);
        --road: #1f2838;
        --road-2: #171e2d;
        --line: #f8fafc;
        --grass: #0f5c3c;
        --grass-2: #0f472d;
        --car-red: #ff5c7a;
        --car-blue: #54c7ff;
        --car-green: #7df9a8;
        --car-yellow: #ffd166;
        --coin: #ffe66d;
        --accent: #7ef9ff;
        --text: #edf6ff;
        --muted: #b7c7df;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(circle at top, #162238 0%, var(--bg) 45%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        display: grid;
        place-items: center;
      }

      .app {
        width: min(96vw, 980px);
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        box-shadow: 0 25px 60px rgba(0,0,0,0.35);
        padding: 16px;
      }

      .hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 0 8px 14px;
        flex-wrap: wrap;
      }

      .brand {
        color: var(--accent);
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: 0.12em;
      }

      .stats {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .chip {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 999px;
        padding: 7px 12px;
        color: var(--muted);
        font-weight: 700;
      }

      .chip strong {
        color: var(--text);
      }

      canvas {
        width: 100%;
        height: 620px;
        display: block;
        background: linear-gradient(180deg, #0c1525, #08101b 35%);
        border-radius: 16px;
        border: 1px solid rgba(255,255,255,0.08);
      }

      .controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding-top: 14px;
        flex-wrap: wrap;
      }

      .help {
        color: var(--muted);
        font-size: 0.95rem;
      }

      button {
        border: none;
        cursor: pointer;
        border-radius: 999px;
        padding: 10px 18px;
        font-weight: 800;
        background: linear-gradient(135deg, var(--accent), #56d4ff);
        color: #03131d;
        box-shadow: 0 10px 22px rgba(126, 249, 255, 0.28);
      }

      @media (max-width: 680px) {
        .hud, .controls {
          flex-direction: column;
          align-items: flex-start;
        }

        canvas {
          height: 500px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="hud">
        <div class="brand">NEON HIGHWAY RUSH</div>
        <div class="stats">
          <div class="chip">Score: <strong id="score">0</strong></div>
          <div class="chip">Best: <strong id="best">0</strong></div>
          <div class="chip">Coins: <strong id="coins">0</strong></div>
        </div>
      </div>

      <canvas id="gameCanvas" width="900" height="620"></canvas>

      <div class="controls">
        <div class="help">Steer with A/D or arrow keys. Collect coins, dodge traffic.</div>
        <button id="restartBtn">Restart</button>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const coinsEl = document.getElementById('coins');
      const restartBtn = document.getElementById('restartBtn');

      const keys = {
        ArrowLeft: false,
        ArrowRight: false,
        ArrowUp: false,
        ArrowDown: false,
        a: false,
        d: false,
        w: false,
        s: false
      };

      const ROAD = { left: 180, right: canvas.width - 180, top: 0, bottom: canvas.height };
      let best = Number(localStorage.getItem('neon-highway-rush-best') || 0);
      let gameState = 'ready';
      let vehs = [];
      let coins = [];
      let particles = [];
      let lastTime = 0;
      let score = 0;
      let coinCount = 0;
      let spawnTimer = 0;
      let coinTimer = 0;
      let roadSpeed = 300;

      const player = {
        x: canvas.width / 2,
        y: canvas.height - 110,
        width: 44,
        height: 88,
        speed: 350,
        color: '#7ef9ff'
      };

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function updateHud() {
        scoreEl.textContent = Math.floor(score);
        bestEl.textContent = best;
        coinsEl.textContent = coinCount;
      }

      function setBest() {
        if (score > best) {
          best = Math.floor(score);
          localStorage.setItem('neon-highway-rush-best', String(best));
        }
        bestEl.textContent = best;
      }

      function resetGame() {
        vehs = [];
        coins = [];
        particles = [];
        score = 0;
        coinCount = 0;
        spawnTimer = 0.6;
        coinTimer = 1.4;
        roadSpeed = 300;
        player.x = canvas.width / 2;
        player.y = canvas.height - 110;
        updateHud();
        gameState = 'running';
      }

      function spawnVehicle() {
        const colors = ['#ff5c7a', '#54c7ff', '#7df9a8', '#ffd166', '#d09cff'];
        const width = 48;
        const height = 86;
        const laneCount = 4;
        const laneW = (ROAD.right - ROAD.left) / laneCount;
        const lane = Math.floor(Math.random() * laneCount);
        const x = ROAD.left + lane * laneW + laneW / 2;

        vehs.push({
          x,
          y: -height - 8,
          width,
          height,
          color: colors[Math.floor(Math.random() * colors.length)],
          speed: roadSpeed * (0.95 + Math.random() * 0.6)
        });
      }

      function spawnCoin() {
        const laneCount = 4;
        const laneW = (ROAD.right - ROAD.left) / laneCount;
        const lane = Math.floor(Math.random() * laneCount);
        const x = ROAD.left + lane * laneW + laneW / 2;
        const radius = 12;

        coins.push({
          x,
          y: -radius - 10,
          radius,
          bob: Math.random() * Math.PI * 2
        });
      }

      function addParticles(x, y, color, count = 20) {
        for (let i = 0; i < count; i++) {
          particles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 220,
            vy: (Math.random() - 0.5) * 220,
            life: 0.5 + Math.random() * 0.6,
            color,
            radius: Math.random() * 3 + 2
          });
        }
      }

      function updatePlayer(dt) {
        let dx = 0;
        let dy = 0;

        if (keys.ArrowLeft || keys.a) dx -= 1;
        if (keys.ArrowRight || keys.d) dx += 1;
        if (keys.ArrowUp || keys.w) dy -= 1;
        if (keys.ArrowDown || keys.s) dy += 1;

        if (dx !== 0 || dy !== 0) {
          const len = Math.hypot(dx, dy) || 1;
          player.x += (dx / len) * player.speed * dt;
          player.y += (dy / len) * player.speed * dt;
        }

        player.x = clamp(player.x, ROAD.left + 36, ROAD.right - 36);
        player.y = clamp(player.y, ROAD.top + 50, ROAD.bottom - 60);
      }

      function updateTraffic(dt) {
        for (let i = vehs.length - 1; i >= 0; i--) {
          const v = vehs[i];
          v.y += (roadSpeed + v.speed) * dt;

          const overlaps =
            Math.abs(player.x - v.x) < (player.width + v.width) * 0.5 &&
            Math.abs(player.y - v.y) < (player.height + v.height) * 0.5;

          if (overlaps) {
            addParticles(player.x, player.y, '#ff5c7a', 40);
            gameState = 'gameover';
            setBest();
            updateHud();
            return;
          }

          if (v.y > canvas.height + 100) vehs.splice(i, 1);
        }
      }

      function updateCoins(dt) {
        for (let i = coins.length - 1; i >= 0; i--) {
          const c = coins[i];
          c.y += (roadSpeed + 80) * dt;
          c.bob += dt * 6;

          const caught = Math.hypot(player.x - c.x, player.y - c.y) < (player.width * 0.7 + c.radius);
          if (caught) {
            coinCount += 1;
            score += 25;
            addParticles(c.x, c.y, '#ffe66d', 18);
            coins.splice(i, 1);
            updateHud();
            continue;
          }

          if (c.y > canvas.height + 30) coins.splice(i, 1);
        }
      }

      function updateParticles(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;
          if (p.life <= 0) particles.splice(i, 1);
        }
      }

      function update(dt) {
        if (gameState !== 'running') {
          updateParticles(dt);
          return;
        }

        score += dt * 12;
        roadSpeed += dt * 6;

        updatePlayer(dt);
        spawnTimer -= dt;
        coinTimer -= dt;

        if (spawnTimer <= 0) {
          spawnVehicle();
          spawnTimer = Math.max(0.4, 1.2 - score / 450);
        }

        if (coinTimer <= 0) {
          spawnCoin();
          coinTimer = 1.8 + Math.random() * 1.4;
        }

        updateTraffic(dt);
        updateCoins(dt);
        updateParticles(dt);
        updateHud();
      }

      function drawBackground() {
        ctx.fillStyle = '#12372a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#0e2d1f';
        ctx.fillRect(ROAD.left - 40, 0, canvas.width - (ROAD.left - 40) * 2, canvas.height);

        ctx.fillStyle = '#1b2432';
        ctx.fillRect(ROAD.left, 0, ROAD.right - ROAD.left, canvas.height);

        const roadWidth = ROAD.right - ROAD.left;
        const stripeCount = 12;
        const stripeH = 80;
        const offset = (score * 14) % (stripeH + 18);

        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 4;
        ctx.setLineDash([30, 26]);
        for (let i = -1; i < stripeCount; i++) {
          const y = i * (stripeH + 18) + offset;
          ctx.beginPath();
          ctx.moveTo(canvas.width / 2 - 6, y);
          ctx.lineTo(canvas.width / 2 - 6, y + stripeH - 12);
          ctx.moveTo(canvas.width / 2 + 6, y);
          ctx.lineTo(canvas.width / 2 + 6, y + stripeH - 12);
          ctx.stroke();
        }
        ctx.setLineDash([]);

        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(ROAD.left, 0);
        ctx.lineTo(ROAD.left, canvas.height);
        ctx.moveTo(ROAD.right, 0);
        ctx.lineTo(ROAD.right, canvas.height);
        ctx.stroke();
      }

      function drawPlayer() {
        const { x, y, width, height } = player;

        ctx.save();
        ctx.translate(x, y);

        ctx.fillStyle = '#7ef9ff';
        ctx.fillRect(-width / 2, -height / 2, width, height);

        ctx.fillStyle = '#d8fbff';
        ctx.fillRect(-width * 0.3, -height * 0.25, width * 0.6, height * 0.28);

        ctx.fillStyle = '#072634';
        ctx.fillRect(-width * 0.28, -height * 0.42, width * 0.18, height * 0.18);
        ctx.fillRect(width * 0.1, -height * 0.42, width * 0.18, height * 0.18);

        ctx.fillStyle = '#0a1d2a';
        ctx.fillRect(-width * 0.34, height * 0.18, width * 0.18, height * 0.18);
        ctx.fillRect(width * 0.16, height * 0.18, width * 0.18, height * 0.18);

        ctx.restore();
      }

      function drawVehicle(v) {
        ctx.save();
        ctx.translate(v.x, v.y);

        ctx.fillStyle = v.color;
        ctx.fillRect(-v.width / 2, -v.height / 2, v.width, v.height);

        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        ctx.fillRect(-v.width * 0.2, -v.height * 0.22, v.width * 0.4, v.height * 0.25);

        ctx.fillStyle = '#0b1220';
        ctx.fillRect(-v.width * 0.3, -v.height * 0.45, v.width * 0.16, v.height * 0.12);
        ctx.fillRect(v.width * 0.14, -v.height * 0.45, v.width * 0.16, v.height * 0.12);
        ctx.fillRect(-v.width * 0.3, v.height * 0.32, v.width * 0.16, v.height * 0.12);
        ctx.fillRect(v.width * 0.14, v.height * 0.32, v.width * 0.16, v.height * 0.12);

        ctx.restore();
      }

      function drawCoin(c) {
        ctx.save();
        ctx.translate(c.x, c.y + Math.sin(c.bob) * 5);

        ctx.fillStyle = '#ffe66d';
        ctx.beginPath();
        ctx.arc(0, 0, c.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#f5b700';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, c.radius * 0.7, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
      }

      function drawParticles() {
        for (const p of particles) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function drawReady() {
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#f8fafc';
        ctx.textAlign = 'center';
        ctx.font = 'bold 54px Arial';
        ctx.fillText('NEON HIGHWAY', canvas.width / 2, canvas.height / 2 - 18);

        ctx.font = '22px Arial';
        ctx.fillStyle = '#dfeafc';
        ctx.fillText('Press any movement key to begin', canvas.width / 2, canvas.height / 2 + 28);
      }

      function drawGameOver() {
        ctx.fillStyle = 'rgba(0,0,0,0.42)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#f8fafc';
        ctx.textAlign = 'center';
        ctx.font = 'bold 54px Arial';
        ctx.fillText('CRASH!', canvas.width / 2, canvas.height / 2 - 20);

        ctx.font = '26px Arial';
        ctx.fillStyle = '#7ef9ff';
        ctx.fillText(`Score: ${Math.floor(score)}`, canvas.width / 2, canvas.height / 2 + 24);

        ctx.font = '20px Arial';
        ctx.fillStyle = '#dfeafc';
        ctx.fillText('Press Restart or R to play again', canvas.width / 2, canvas.height / 2 + 64);
      }

      function render() {
        drawBackground();

        for (const c of coins) drawCoin(c);
        for (const v of vehs) drawVehicle(v);
        drawPlayer();
        drawParticles();

        if (gameState === 'ready') drawReady();
        if (gameState === 'gameover') drawGameOver();
      }

      function loop(ts) {
        const dt = Math.min((ts - lastTime) / 1000 || 0.016, 0.033);
        lastTime = ts;

        update(dt);
        render();
        requestAnimationFrame(loop);
      }

      function startIfNeeded() {
        if (gameState === 'ready') resetGame();
      }

      document.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();

        if (key in keys) {
          keys[key] = true;
          event.preventDefault();
          startIfNeeded();
        }

        if (gameState === 'gameover' && (key === 'r' || event.key === ' ')) {
          resetGame();
        }
      });

      document.addEventListener('keyup', (event) => {
        const key = event.key.toLowerCase();
        if (key in keys) keys[key] = false;
      });

      restartBtn.addEventListener('click', () => {
        resetGame();
      });

      updateHud();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
